<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMAZON_CLONE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div class="navbar">
        <div class="Amazon_Logo"></div>
        <div class="deliveryAddress">
            <p style="margin-left:25px; color: rgb(247, 242, 242);">Deliver To</p>
            <div class="locationLogo">
                <i class="fa-solid fa-location-dot" style="color: rgb(255, 255, 255);"></i>
                 Kashmir</div>
        </div>
        <div class="navSearch">
                <select class="navSelect">
                    <option>All</option>
                    <option>Clothes</option>
                    <option>Electronics</option>
                    <option>Gadgets</option>
                    <option>Beauty Prodcuts</option>
                </select>
                <input class="navSearchAmazon" type="text" placeholder="Search Amazon">
            <div class="navSearchLogo">
                <i class="fa-solid fa-magnifying-glass" style="color: rgb(255, 255, 255);"></i>
            </div>
        </div>
        <div class="signIn">
            <p style="font-size: 0.8rem;">Hello, sign in</p>
            <p><b>Account & Lists</b></p>
        </div>
        <div class="returnStuff">
            <p style="font-size: 0.8rem;">Returns</p>
            <p><b>& Orders</b></p>
        </div>
        <div class="cart">
            <i class="fa-solid fa-cart-shopping" style="color: rgb(255, 255, 255);"></i>
            <p><b>Cart</b></p>
        </div>
    </div>
    
</body>
</html>
